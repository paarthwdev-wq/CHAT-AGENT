services:
  - type: web
    name: whatsapp-antigravity-bot
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ALLOWED_NUMBERS
        sync: false
      - key: PORT
        value: 3000
      - key: TELEGRAM_BOT_TOKEN
        sync: false

